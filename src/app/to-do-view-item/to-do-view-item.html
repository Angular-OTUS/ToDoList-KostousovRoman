<div class="card">
    <mat-icon class="close" (click)="close()">close</mat-icon>
    <h1>{{ task()?.name }}</h1>
    <textarea (change)="changeDescription($event)" [value]="task()?.description"></textarea>
    <mat-form-field>
        <mat-label>{{ 'status' | translate }}</mat-label>
        <mat-select [value]="task()?.status" (selectionChange)="changeStatus($event.value)">
            <mat-option value="todo">{{ 'todo' | translate }}</mat-option>
            <mat-option value="inProgress">{{ 'inProgress' | translate }}</mat-option>
            <mat-option value="completed">{{ 'completed' | translate }}</mat-option>
        </mat-select>
    </mat-form-field>
</div>
